<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="navbar">
        <h1>Medicine Store</h1>
        <div class="nav-links">
            <a href="home.HTML">Home</a>
            <a href="cart.HTML">Cart</a>
            <a href="orders.HTML">Orders</a>
            <span id="welcomeText">Loading...</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
    <div class="main-content">
        <h2>My Orders</h2>
        <div id="ordersList" class="orders-container"></div>
    </div>
    <script>
        async function loadUser() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = 'login.HTML';
                    return;
                }

                const res = await fetch("http://localhost:3000/auth/me", {
                    method: "GET",
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: "include"
                });

                const data = await res.json();
                if (data.user) {
                    document.getElementById("welcomeText").textContent = "Welcome " + data.user.NAME;
                } else {
                    window.location.href = 'login.HTML';
                }
            } catch (err) {
                console.error(err);
                document.getElementById("welcomeText").textContent = "Cannot connect to server";
            }
        }

        async function loadOrders() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch("http://localhost:3000/order/my-orders", {
                    method: "GET",
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await res.json();
                const ordersList = document.getElementById('ordersList');
                
                if (data.data && data.data.length > 0) {
                    ordersList.innerHTML = data.data.map(order => `
                        <div class="order-card">
                            <div class="order-header">
                                <h3>Order #${order.ID}</h3>
                                <span class="order-status status-${order.STATUS}">${order.STATUS}</span>
                            </div>
                            <p><strong>Total Amount:</strong> $${order.TOTAL_AMOUNT}</p>
                            <p><strong>Shipping Address:</strong><br/>
                            ${order.STREET}, ${order.CITY}, ${order.STATE} ${order.POSTAL_CODE}</p>
                            <p><strong>Order Date:</strong> ${new Date(order.CREATED_AT).toLocaleDateString()}</p>
                        </div>
                    `).join('');
                } else {
                    ordersList.innerHTML = '<p>No orders found</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('ordersList').innerHTML = '<p>Error loading orders</p>';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.HTML';
        });

        loadUser();
        loadOrders();
    </script>
</body>
</html>
