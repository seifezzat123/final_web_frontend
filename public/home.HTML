<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="navbar">
        <h1>Medicine Store</h1>
        <div class="nav-links">
            <a href="home.HTML">Home</a>
            <a href="cart.HTML">Cart</a>
            <a href="orders.HTML">Orders</a>
            <span id="welcomeText">Loading...</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
    <div class="main-content">
        <h2>Available Medicines</h2>
        <div id="medicineList" class="medicine-grid"></div>
    </div>

    <div id="feedbackModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeFeedbackForm()">&times;</span>
            <h2>Leave Feedback</h2>
            <form id="feedbackForm">
                <input type="hidden" id="feedbackMedicineId"/>
                <div class="input-group">
                    <label>Medicine</label>
                    <input type="text" id="feedbackMedicineName" readonly/>
                </div>
                <div class="input-group">
                    <label>Rating (1-5)</label>
                    <select id="feedbackRating" required>
                        <option value="">Select Rating</option>
                        <option value="1">1 - Poor</option>
                        <option value="2">2 - Fair</option>
                        <option value="3">3 - Good</option>
                        <option value="4">4 - Very Good</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Comment</label>
                    <textarea id="feedbackComment" rows="4" required></textarea>
                </div>
                <button type="submit">Submit Feedback</button>
            </form>
        </div>
    </div>
    <script>
        async function loadUser() {
            const token = localStorage.getItem('token');
            console.log('Token from localStorage:', token);
            if (!token) {
                console.log('No token found, redirecting to login');
                window.location.href = 'login.HTML';
                return;
            }
            console.log('Token found, staying on home page');
            document.getElementById("welcomeText").textContent = "Welcome User";
        }

        async function loadMedicines() {
            try {
                const res = await fetch("http://localhost:3000/medicine", {
                    method: "GET"
                });

                const data = await res.json();
                const medicineList = document.getElementById('medicineList');
                
                if (data.data && data.data.length > 0) {
                    medicineList.innerHTML = data.data.map(med => `
                        <div class="medicine-card">
                            <h3>${med.NAME}</h3>
                            <p><strong>Price:</strong> $${med.PRICE}</p>
                            <p><strong>Stock:</strong> ${med.STOCK}</p>
                            <p><strong>Description:</strong> ${med.DESCRIPTION || 'N/A'}</p>
                            <p><strong>Expiry:</strong> ${med.EXPIRY_DATE || 'N/A'}</p>
                            <button onclick="addToCart(${med.ID})">Add to Cart</button>
                            <button onclick="showFeedbackForm(${med.ID}, '${med.NAME.replace(/'/g, "\\'")}')" class="feedback-btn">Leave Review</button>
                        </div>
                    `).join('');
                } else {
                    medicineList.innerHTML = '<p>No medicines available</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('medicineList').innerHTML = '<p>Error loading medicines</p>';
            }
        }

        async function addToCart(medicineId) {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('http://localhost:3000/cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ medicine_id: medicineId, quantity: 1 })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('✅ Medicine added to cart successfully!');
                } else {
                    alert('❌ ' + (data.error || 'Failed to add to cart'));
                }
            } catch (err) {
                console.error(err);
                alert('❌ Error adding to cart');
            }
        }

        function showFeedbackForm(medicineId, medicineName) {
            document.getElementById('feedbackMedicineId').value = medicineId;
            document.getElementById('feedbackMedicineName').value = medicineName;
            document.getElementById('feedbackModal').style.display = 'block';
        }

        function closeFeedbackForm() {
            document.getElementById('feedbackModal').style.display = 'none';
            document.getElementById('feedbackForm').reset();
        }

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const medicine_id = document.getElementById('feedbackMedicineId').value;
            const rating = document.getElementById('feedbackRating').value;
            const comment = document.getElementById('feedbackComment').value.trim();

            try {
                const token = localStorage.getItem('token');
                const res = await fetch('http://localhost:3000/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ medicine_id, rating, comment })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('Feedback submitted successfully!');
                    closeFeedbackForm();
                } else {
                    alert(data.error || 'Failed to submit feedback');
                }
            } catch (err) {
                console.error(err);
                alert('Error submitting feedback');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.HTML';
        });

        window.onclick = function(event) {
            const modal = document.getElementById('feedbackModal');
            if (event.target == modal) {
                closeFeedbackForm();
            }
        }

        loadUser();
        loadMedicines();
    </script>
</body>
</html>
