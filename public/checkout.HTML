<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="navbar">
        <h1>Medicine Store</h1>
        <div class="nav-links">
            <a href="home.HTML">Home</a>
            <a href="cart.HTML">Cart</a>
            <span id="welcomeText">Loading...</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
    <div class="main-content">
        <h2>Checkout</h2>
        <div class="checkout-container">
            <div class="order-summary" id="orderSummary"></div>
            <form id="checkoutForm" class="checkout-form">
                <h3>Shipping Address</h3>
                <div class="input-group">
                    <label>Street</label>
                    <input type="text" id="street" required/>
                </div>
                <div class="input-group">
                    <label>Building</label>
                    <input type="text" id="building" required/>
                </div>
                <div class="input-group">
                    <label>Floor</label>
                    <input type="text" id="floor" required/>
                </div>
                <div class="input-group">
                    <label>Apartment</label>
                    <input type="text" id="apartment" required/>
                </div>
                <button type="submit">Place Order</button>
            </form>
        </div>
    </div>
    <script>
        async function loadUser() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.HTML';
                return;
            }
            document.getElementById("welcomeText").textContent = "Welcome User";
        }

        async function loadOrderSummary() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch("http://localhost:3000/cart/my-cart", {
                    method: "GET",
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await res.json();
                const orderSummary = document.getElementById('orderSummary');
                
                if (data.data && data.data.length > 0) {
                    let total = 0;
                    let itemsHTML = '<h3>Order Summary</h3>';
                    data.data.forEach(item => {
                        total += item.PRICE * item.QUANTITY;
                        itemsHTML += `
                            <div class="summary-item">
                                <span>${item.MEDICINE_NAME} x ${item.QUANTITY}</span>
                                <span>$${(item.PRICE * item.QUANTITY).toFixed(2)}</span>
                            </div>
                        `;
                    });
                    itemsHTML += `<div class="summary-total"><strong>Total: $${total.toFixed(2)}</strong></div>`;
                    orderSummary.innerHTML = itemsHTML;
                } else {
                    orderSummary.innerHTML = '<p>Your cart is empty</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('orderSummary').innerHTML = '<p>Error loading order summary</p>';
            }
        }

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const street = document.getElementById('street').value.trim();
            const building = document.getElementById('building').value.trim();
            const floor = document.getElementById('floor').value.trim();
            const apartment = document.getElementById('apartment').value.trim();

            try {
                const token = localStorage.getItem('token');
                
                // Get the cart items first
                const cartRes = await fetch("http://localhost:3000/cart/my-cart", {
                    method: "GET",
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const cartData = await cartRes.json();
                
                if (!cartData.data || cartData.data.length === 0) {
                    alert('Your cart is empty!');
                    return;
                }
                
                // Use cart_id = 1 as a placeholder (backend should handle this)
                // and create order with address details embedded
                const orderRes = await fetch('http://localhost:3000/order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        address_id: 1,  // placeholder
                        cart_id: 1,     // placeholder
                        street, 
                        building, 
                        floor, 
                        apartment
                    })
                });

                const orderData = await orderRes.json();
                if (orderRes.ok) {
                    alert('✅ Order placed successfully!');
                    window.location.href = 'orders.HTML';
                } else {
                    alert('❌ ' + (orderData.error || 'Failed to place order'));
                }
            } catch (err) {
                console.error(err);
                alert('❌ Error placing order');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.HTML';
        });

        loadUser();
        loadOrderSummary();
    </script>
</body>
</html>
