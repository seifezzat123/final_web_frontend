<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="navbar">
        <h1>Medicine Store</h1>
        <div class="nav-links">
            <a href="home.HTML">Home</a>
            <a href="cart.HTML">Cart</a>
            <span id="welcomeText">Loading...</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
    <div class="main-content">
        <h2>Checkout</h2>
        <div class="checkout-container">
            <div class="order-summary" id="orderSummary"></div>
            <div class="checkout-form">
                <h3>Shipping Address</h3>
                
                <!-- Saved Addresses Section -->
                <div id="savedAddressesSection" style="display:none;">
                    <div class="input-group">
                        <label>Select Saved Address</label>
                        <select id="savedAddresses">
                            <option value="">Choose an address...</option>
                        </select>
                    </div>
                    <button type="button" onclick="showNewAddressForm()" class="secondary-btn">Add New Address</button>
                </div>
                
                <!-- New Address Form -->
                <form id="addressForm">
                    <div class="input-group">
                        <label>Street</label>
                        <input type="text" id="street" required/>
                    </div>
                    <div class="input-group">
                        <label>Building</label>
                        <input type="text" id="building" required/>
                    </div>
                    <div class="input-group">
                        <label>Floor</label>
                        <input type="text" id="floor" required/>
                    </div>
                    <div class="input-group">
                        <label>Apartment</label>
                        <input type="text" id="apartment" required/>
                    </div>
                    <button type="submit">Save Address & Continue</button>
                </form>
                
                <!-- Place Order Button -->
                <button id="placeOrderBtn" style="display:none;" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>
    <script>
        async function loadUser() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.HTML';
                return;
            }
            document.getElementById("welcomeText").textContent = "Welcome User";
        }

        async function loadOrderSummary() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch("http://localhost:3000/cart/my-cart", {
                    method: "GET",
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await res.json();
                const orderSummary = document.getElementById('orderSummary');
                
                if (data.data && data.data.length > 0) {
                    let total = 0;
                    let itemsHTML = '<h3>Order Summary</h3>';
                    data.data.forEach(item => {
                        total += item.PRICE * item.QUANTITY;
                        itemsHTML += `
                            <div class="summary-item">
                                <span>${item.MEDICINE_NAME} x ${item.QUANTITY}</span>
                                <span>$${(item.PRICE * item.QUANTITY).toFixed(2)}</span>
                            </div>
                        `;
                    });
                    itemsHTML += `<div class="summary-total"><strong>Total: $${total.toFixed(2)}</strong></div>`;
                    orderSummary.innerHTML = itemsHTML;
                } else {
                    orderSummary.innerHTML = '<p>Your cart is empty</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('orderSummary').innerHTML = '<p>Error loading order summary</p>';
            }
        }

        let savedAddressesList = [];
        let selectedAddressId = null;

        async function loadSavedAddresses() {
            try {
                const addresses = localStorage.getItem('userAddresses');
                if (addresses && addresses !== 'undefined' && addresses !== 'null') {
                    savedAddressesList = JSON.parse(addresses);
                    if (savedAddressesList.length > 0) {
                        displaySavedAddresses();
                        return;
                    }
                }
                // No addresses found, show form
                showNewAddressForm();
            } catch (err) {
                console.error(err);
                showNewAddressForm();
            }
        }

        function displaySavedAddresses() {
            const section = document.getElementById('savedAddressesSection');
            const select = document.getElementById('savedAddresses');
            const placeOrderBtn = document.getElementById('placeOrderBtn');
            
            section.style.display = 'block';
            
            savedAddressesList.forEach((addr, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${addr.street}, Building ${addr.building}, Floor ${addr.floor}, Apt ${addr.apartment}`;
                select.appendChild(option);
            });
            
            select.addEventListener('change', (e) => {
                if (e.target.value !== '') {
                    selectedAddressId = parseInt(e.target.value);
                    placeOrderBtn.style.display = 'block';
                } else {
                    placeOrderBtn.style.display = 'none';
                }
            });
        }

        function showNewAddressForm() {
            document.getElementById('savedAddressesSection').style.display = 'none';
            document.getElementById('addressForm').style.display = 'block';
            document.getElementById('placeOrderBtn').style.display = 'none';
        }

        document.getElementById('addressForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newAddress = {
                street: document.getElementById('street').value.trim(),
                building: document.getElementById('building').value.trim(),
                floor: document.getElementById('floor').value.trim(),
                apartment: document.getElementById('apartment').value.trim()
            };
            
        loadSavedAddresses();
            // Save to localStorage
            savedAddressesList.push(newAddress);
            localStorage.setItem('userAddresses', JSON.stringify(savedAddressesList));
            
            selectedAddressId = savedAddressesList.length - 1;
            alert('✅ Address saved!');
            
            // Show place order button
            document.getElementById('addressForm').style.display = 'none';
            document.getElementById('placeOrderBtn').style.display = 'block';
        });

        async function placeOrder() {
            try {
                const token = localStorage.getItem('token');
                
                if (selectedAddressId === null) {
                    alert('Please select an address!');
                    return;
                }
                
                const address = savedAddressesList[selectedAddressId];
                
                // Get the cart items first
                const cartRes = await fetch("http://localhost:3000/cart/my-cart", {
                    method: "GET",
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const cartData = await cartRes.json();
                
                if (!cartData.data || cartData.data.length === 0) {
                    alert('Your cart is empty!');
                    return;
                }
                
                // Create order with selected address (backend should create address automatically)
                const orderRes = await fetch('http://localhost:3000/order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        street: address.street,
                        building: address.building,
                        floor: address.floor,
                        apartment: address.apartment
                    })
                });

                const orderData = await orderRes.json();
                if (orderRes.ok) {
                    alert('✅ Order placed successfully!');
                    window.location.href = 'orders.HTML';
                } else {
                    alert('❌ ' + (orderData.error || 'Failed to place order'));
                }
            } catch (err) {
                console.error(err);
                alert('❌ Error placing order');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.HTML';
        });

        loadUser();
        loadOrderSummary();
    </script>
</body>
</html>
