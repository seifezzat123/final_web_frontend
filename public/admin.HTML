<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="navbar">
        <h1>3ALEGNY Store - Admin Dashboard</h1>
        <div class="nav-links">
            <a href="admin.HTML">Dashboard</a>
            <span id="welcomeText">Loading...</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
    <div class="main-content">
        <h2>Admin Panel</h2>
        
        <!-- Statistics Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>Total Users</h3>
                <p id="totalUsers" class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Medicines</h3>
                <p id="totalMedicines" class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Orders</h3>
                <p id="totalOrders" class="stat-number">0</p>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('users')">Users</button>
            <button class="tab-btn" onclick="showTab('medicines')">Medicines</button>
            <button class="tab-btn" onclick="showTab('orders')">Orders</button>
        </div>

        <!-- Users Tab -->
        <div id="usersTab" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>All Users</h3>
                <button onclick="showAddUserModal()" class="primary-btn">Add New User</button>
            </div>
            <div id="usersList" class="data-list"></div>
        </div>

        <!-- Medicines Tab -->
        <div id="medicinesTab" class="tab-content">
            <h3>All Medicines</h3>
            <div id="medicinesList" class="data-list"></div>
        </div>

        <!-- Orders Tab -->
        <div id="ordersTab" class="tab-content">
            <h3>All Orders</h3>
            <div id="ordersList" class="data-list"></div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="addUserModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddUserModal()">&times;</span>
            <h2>Add New User</h2>
            <form id="addUserForm">
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="userName" required/>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="userEmail" required/>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="userPassword" minlength="6" required/>
                </div>
                <div class="input-group">
                    <label>Role</label>
                    <select id="userRole" required>
                        <option value="">Select Role</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit">Add User</button>
            </form>
        </div>
    </div>

    <!-- Edit Medicine Modal -->
    <div id="editMedicineModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditMedicineModal()">&times;</span>
            <h2>Edit Medicine</h2>
            <form id="editMedicineForm">
                <input type="hidden" id="editMedicineId"/>
                <div class="input-group">
                    <label>Medicine Name</label>
                    <input type="text" id="editMedicineName" required/>
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="editMedicineDescription" rows="3" required></textarea>
                </div>
                <div class="input-group">
                    <label>Price ($)</label>
                    <input type="number" id="editMedicinePrice" step="0.01" min="0" required/>
                </div>
                <div class="input-group">
                    <label>Stock</label>
                    <input type="number" id="editMedicineStock" min="0" required/>
                </div>
                <div class="input-group">
                    <label>Expiry Date</label>
                    <input type="date" id="editMedicineExpiry" required/>
                </div>
                <button type="submit">Update Medicine</button>
            </form>
        </div>
    </div>

    <script>
        let currentTab = 'users';

        async function loadUser() {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('userRole');
            
            if (!token) {
                window.location.href = 'login.HTML';
                return;
            }
            
            if (role !== 'admin') {
                alert('Access denied. Admins only.');
                window.location.href = 'home.HTML';
                return;
            }
            
            document.getElementById("welcomeText").textContent = "Welcome Admin";
        }

        function showTab(tabName) {
            currentTab = tabName;
            
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
            
            // Load data for the tab
            if (tabName === 'users') loadUsers();
            else if (tabName === 'medicines') loadMedicines();
            else if (tabName === 'orders') loadOrders();
        }

        async function loadUsers() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('http://localhost:3000/user', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) {
                    throw new Error('Failed to fetch users');
                }
                
                const data = await res.json();
                const list = document.getElementById('usersList');
                
                if (data.data && data.data.length > 0) {
                    document.getElementById('totalUsers').textContent = data.data.length;
                    list.innerHTML = data.data.map(user => `
                        <div class="data-card">
                            <h4>${user.NAME || user.USER_NAME || 'Unknown'}</h4>
                            <p><strong>Email:</strong> ${user.EMAIL}</p>
                            <p><strong>Role:</strong> <span class="role-badge ${user.ROLE}">${user.ROLE}</span></p>
                            <p><strong>ID:</strong> ${user.USER_ID || user.ID}</p>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p>No users found or endpoint not available</p>';
                }
            } catch (err) {
                console.error('Error loading users:', err);
                document.getElementById('usersList').innerHTML = '<p>User management not available. Backend endpoint may not exist.</p>';
            }
        }

        async function loadMedicines() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('http://localhost:3000/medicine', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                const list = document.getElementById('medicinesList');
                
                if (data.data && data.data.length > 0) {
                    document.getElementById('totalMedicines').textContent = data.data.length;
                    list.innerHTML = data.data.map(med => `
                        <div class="data-card">
                            <h4>${med.NAME || med.MEDICINE_NAME}</h4>
                            <p><strong>Description:</strong> ${med.DESCRIPTION}</p>
                            <p><strong>Price:</strong> $${med.PRICE}</p>
                            <p><strong>Stock:</strong> ${med.STOCK || med.STOCK_QUANTITY}</p>
                            <p><strong>Expiry:</strong> ${med.EXPIRY_DATE || 'N/A'}</p>
                            <div class="button-group" style="margin-top: 10px;">
                                <button onclick="editMedicine(${med.ID || med.MEDICINE_ID})" class="secondary-btn">Edit</button>
                                <button onclick="deleteMedicine(${med.ID || med.MEDICINE_ID})" class="danger-btn">Delete</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p>No medicines found</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('medicinesList').innerHTML = '<p>Error loading medicines</p>';
            }
        }

        async function loadOrders() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('http://localhost:3000/order/all', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                const list = document.getElementById('ordersList');
                
                if (data.data && data.data.length > 0) {
                    document.getElementById('totalOrders').textContent = data.data.length;
                    list.innerHTML = data.data.map(order => `
                        <div class="data-card">
                            <h4>Order #${order.ORDER_ID || order.ID}</h4>
                            <p><strong>User ID:</strong> ${order.USER_ID || 'N/A'}</p>
                            <p><strong>Total:</strong> $${order.TOTAL || order.TOTAL_PRICE || 'N/A'}</p>
                            <p><strong>Status:</strong> <span class="status-badge ${order.STATUS}">${order.STATUS}</span></p>
                            <p><strong>Date:</strong> ${order.ORDER_DATE || order.CREATED_AT || 'N/A'}</p>
                            <div style="margin-top: 10px;">
                                <label style="font-size: 12px; color: #666;">Update Status:</label>
                                <select onchange="updateOrderStatus(${order.ORDER_ID || order.ID}, this.value)" style="width: 100%; margin-top: 5px; padding: 8px;">
                                    <option value="">-- Change Status --</option>
                                    <option value="pending" ${order.STATUS === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="completed" ${order.STATUS === 'completed' ? 'selected' : ''}>Completed</option>
                                    <option value="cancelled" ${order.STATUS === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p>No orders found</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('ordersList').innerHTML = '<p>Error loading orders</p>';
            }
        }
function showAddUserModal() {
            document.getElementById('addUserModal').style.display = 'flex';
        }

        function closeAddUserModal() {
            document.getElementById('addUserModal').style.display = 'none';
            document.getElementById('addUserForm').reset();
        }

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                name: document.getElementById('userName').value.trim(),
                email: document.getElementById('userEmail').value.trim(),
                password: document.getElementById('userPassword').value.trim(),
                role: document.getElementById('userRole').value
            };
            
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('http://localhost:3000/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(userData)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('User added successfully');
                    closeAddUserModal();
                    loadUsers();
                } else {
                    alert(data.error || 'Failed to add user');
                }
            } catch (err) {
                console.error(err);
                alert('Error adding user');
            }
        });

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`http://localhost:3000/user/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    alert('User deleted successfully');
                    loadUsers();
                } else {
                    const data = await res.json().catch(() => ({ error: 'Unknown error' }));
                    alert(`Failed to delete user: ${data.error || res.statusText}`);
                    console.error('Delete error:', data);
                }
            } catch (err) {
                console.error('Delete user error:', err);
                alert('User deletion is not available. Your backend may not have a user delete endpoint.');
            }
        }

        async function editMedicine(medicineId) {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`http://localhost:3000/medicine/${medicineId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.data) {
                    document.getElementById('editMedicineId').value = medicineId;
                    document.getElementById('editMedicineName').value = data.data.NAME || data.data.MEDICINE_NAME;
                    document.getElementById('editMedicineDescription').value = data.data.DESCRIPTION;
                    document.getElementById('editMedicinePrice').value = data.data.PRICE;
                    document.getElementById('editMedicineStock').value = data.data.STOCK || data.data.STOCK_QUANTITY;
                    document.getElementById('editMedicineExpiry').value = data.data.EXPIRY_DATE || '';
                    document.getElementById('editMedicineModal').style.display = 'flex';
                }
            } catch (err) {
                console.error(err);
                alert('Error loading medicine details');
            }
        }

        function closeEditMedicineModal() {
            document.getElementById('editMedicineModal').style.display = 'none';
            document.getElementById('editMedicineForm').reset();
        }

        document.getElementById('editMedicineForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const medicineId = document.getElementById('editMedicineId').value;
            const medicineData = {
                name: document.getElementById('editMedicineName').value.trim(),
                description: document.getElementById('editMedicineDescription').value.trim(),
                price: parseFloat(document.getElementById('editMedicinePrice').value),
                stock: parseInt(document.getElementById('editMedicineStock').value),
                expiry_date: document.getElementById('editMedicineExpiry').value
            };
            
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`http://localhost:3000/medicine/${medicineId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(medicineData)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('Medicine updated successfully');
                    closeEditMedicineModal();
                    loadMedicines();
                } else {
                    alert(data.error || 'Failed to update medicine');
                }
            } catch (err) {
                console.error(err);
                alert('Error updating medicine');
            }
        });

        async function deleteMedicine(medicineId) {
            if (!confirm('Are you sure you want to delete this medicine?')) return;
            
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`http://localhost:3000/medicine/${medicineId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    alert('Medicine deleted successfully');
                    loadMedicines();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Failed to delete medicine');
                }
            } catch (err) {
                console.error(err);
                alert('Error deleting medicine');
            }
        }

        async function updateOrderStatus(orderId, newStatus) {
            if (!newStatus) return;
            
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`http://localhost:3000/order/${orderId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if (res.ok) {
                    alert('Order status updated successfully');
                    loadOrders();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Failed to update order status');
                    loadOrders();
                }
            } catch (err) {
                console.error(err);
                alert('Error updating order status');
                loadOrders();
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const userModal = document.getElementById('addUserModal');
            const medicineModal = document.getElementById('editMedicineModal');
            if (event.target == userModal) {
                closeAddUserModal();
            } else if (event.target == medicineModal) {
                closeEditMedicineModal();
            }
        }

        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('userRole');
            window.location.href = 'login.HTML';
        });

        loadUser();
        loadUsers();
    </script>
</body>
</html>
